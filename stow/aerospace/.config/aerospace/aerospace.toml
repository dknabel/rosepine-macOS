config-version = 2
start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

after-startup-command = ['exec-and-forget borders']

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# notch reserves 32px at the top; bar ends at y=42, so 20 leaves a 10px gap below it
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 20
outer.right = 10

[mode.main.binding]
alt-q = 'exec-and-forget open -na Ghostty'
alt-c = 'close'
alt-e = 'exec-and-forget open ~'
alt-v = 'layout floating tiling'
alt-j = 'layout tiles horizontal vertical'
alt-f = 'fullscreen'
alt-comma = 'layout accordion horizontal vertical'
alt-left = 'focus left'
alt-right = 'focus right'
alt-up = 'focus up'
alt-down = 'focus down'
alt-shift-left = 'move left'
alt-shift-right = 'move right'
alt-shift-up = 'move up'
alt-shift-down = 'move down'
alt-shift-semicolon = 'mode service'
alt-shift-slash = 'exec-and-forget $HOME/.config/sketchybar/plugins/cheatsheet.sh toggle'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
