set -g default-terminal "tmux-256color"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Colors are generated by rosepine-switch (palette-aware, light/dark).
if-shell "test -f ~/.local/state/rose-pine/tmux.conf" "source-file ~/.local/state/rose-pine/tmux.conf"
